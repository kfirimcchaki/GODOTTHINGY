openapi: 3.0.3
info:
  title: NT Scripting API
  version: 1.0.0
  description: |
    HTTP API for creating, publishing and launching Lua scripts that run inside
    Null's Brawl friendly battles.

    Routes are annotated with their provenance: `verified` endpoints were
    confirmed against the live scripting.nulls.gg service, `inferred` ones sit
    behind its beta gate and could not be observed.
  license:
    name: MIT

servers:
  - url: /

tags:
  - name: meta
  - name: scripts
  - name: releases
  - name: users
  - name: auth

paths:
  /api/health:
    get:
      tags: [meta]
      summary: Liveness probe (inferred)
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string }
                  time: { type: string, format: date-time }
                  uptime_seconds: { type: integer }

  /api/meta:
    get:
      tags: [meta]
      summary: Site capabilities and counters (inferred)
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_name: { type: string }
                  auth_mode: { type: string, enum: [mock, connect] }
                  login_path: { type: string, example: /connect }
                  beta_required: { type: boolean }
                  max_code_bytes: { type: integer }
                  max_events_per_second: { type: integer }
                  stats:
                    type: object
                    properties:
                      scripts: { type: integer }
                      releases: { type: integer }
                      authors: { type: integer }

  /api/releases:
    get:
      tags: [releases]
      summary: Global release feed (inferred)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: Recent releases across all published scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Release"
                        - type: object
                          properties:
                            script_id: { type: string, format: uuid }
                            script_name: { type: string }
                            author_name: { type: string }

  /api/me:
    get:
      tags: [auth]
      summary: The signed-in account (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  name: { type: string }
                  username: { type: string }
                  avatar_url: { type: string, nullable: true }
                  is_beta: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/scripts:
    get:
      tags: [scripts]
      summary: List scripts (inferred)
      description: Anonymous callers see published scripts only.
      parameters:
        - { name: query, in: query, schema: { type: string }, description: Free-text search over name and description }
        - { name: author, in: query, schema: { type: string } }
        - { name: favorites, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, created, name], default: updated } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: A page of scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts: { type: array, items: { $ref: "#/components/schemas/Script" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [scripts]
      summary: Create a script (inferred)
      description: Accepts JSON, or a raw body with `?filename=` for a `.lua` upload.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: filename, in: query, schema: { type: string }, description: Used with a raw body upload }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                description: { type: string, nullable: true, maxLength: 2048 }
                code: { type: string }
          text/plain:
            schema: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Script"
                  - type: object
                    properties:
                      code: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/scripts/{scriptId}:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    get:
      tags: [scripts]
      summary: Script metadata (verified)
      description: |
        Public. Owners additionally receive `code` and `is_published`.
        Unknown ids, malformed ids and unpublished drafts owned by someone else
        all return the same 404.
      responses:
        "200":
          description: The script
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Script" }
              example:
                script_id: 01a18307-1527-7454-9557-e96cac0d2448
                name: Among Us MODDED
                description: Among us v3.0.0, but with Sherrif, Jester, undertaker, medic, spy, …
                user_map_id: ef521933-9e64-4408-be9f-aa0888d8dbeb
                user_map_internal_id: CRPJR2C0U:9YGC8UV9RCJ
                created_at: "2026-10-28T15:00:41.895585Z"
                updated_at: "2026-10-30T11:19:37.121507Z"
                published_at: "2026-10-29T16:10:18.287084Z"
                author_uuid: 4572854d-b1b1-406b-82e8-b483998ae0c6
                author_name: ReareKit
                is_favorite: false
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [scripts]
      summary: Rename or re-describe (inferred)
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 128 }
                description: { type: string, nullable: true, maxLength: 2048 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Script" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [scripts]
      summary: Delete a script and its releases (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/code:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    put:
      tags: [scripts]
      summary: Save source, cutting a new release (inferred)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                description: { type: string, nullable: true }
                release_description: { type: string, nullable: true }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Script"
                  - type: object
                    properties:
                      release: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [scripts]
      summary: Read the current source (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema:
                type: object
                properties:
                  script_id: { type: string, format: uuid }
                  code: { type: string }
                  updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/publish:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    post:
      tags: [scripts]
      summary: Publish and bind a user map (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Script" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/unpublish:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    post:
      tags: [scripts]
      summary: Withdraw from the public listing (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Unpublished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Script" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/share:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    post:
      tags: [scripts]
      summary: Mint a friendly-battle launch link (error path verified)
      description: |
        Requires the owner plus beta access. A caller without beta entitlement
        receives `404 {"error":"Script not found"}` even for a published script
        that is publicly readable — matching the live service.
      security: [{ cookieAuth: [] }]
      responses:
        "201":
          description: Launch link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_url: { type: string }
                  launch_url: { type: string, example: "nullsbrawl://scripting/play?token=abc123" }
                  script_id: { type: string, format: uuid }
                  release_id: { type: integer, nullable: true }
                  expires_at: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [scripts]
      summary: List recent launch links (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Existing links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        share_url: { type: string }
                        launch_url: { type: string }
                        release_id: { type: integer, nullable: true }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/releases:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    get:
      tags: [releases]
      summary: Release history (verified)
      responses:
        "200":
          description: Releases, ascending by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases: { type: array, items: { $ref: "#/components/schemas/Release" } }
              example:
                releases:
                  - { id: 15862, description: null, created_at: "2026-10-28T15:00:41.895585Z" }
                  - { id: 15887, description: null, created_at: "2026-10-28T16:13:27.952037Z" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/releases/{releaseId}:
    parameters:
      - { $ref: "#/components/parameters/ScriptId" }
      - { name: releaseId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [releases]
      summary: One release with its source (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The release
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Release"
                  - type: object
                    properties:
                      code: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scripts/{scriptId}/favorite:
    parameters: [{ $ref: "#/components/parameters/ScriptId" }]
    post:
      tags: [users]
      summary: Star a script (inferred, idempotent)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Starred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Unstar a script (inferred, idempotent)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Unstarred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/{userId}:
    get:
      tags: [users]
      summary: Public profile (verified)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The profile — exactly three fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example:
                user_id: 4572854d-b1b1-406b-82e8-b483998ae0c6
                name: ReareKit
                username: rearekit
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{userId}/scripts:
    get:
      tags: [users]
      summary: An author's scripts (inferred)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Profile plus scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  scripts: { type: array, items: { $ref: "#/components/schemas/Script" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/favorites:
    get:
      tags: [users]
      summary: Your starred scripts (inferred)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts: { type: array, items: { $ref: "#/components/schemas/Script" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/session:
    post:
      tags: [auth]
      summary: Exchange an id_token for a session
      description: |
        OIDC implicit flow. The id_token arrives in the URL fragment, which
        browsers never send to a server, so the SPA posts it here. Verified
        with RS256 against the provider's JWKS (HS256 in mock mode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string, description: Signed JWT }
      responses:
        "200":
          description: Session established; cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  name: { type: string }
                  username: { type: string }
                  avatar_url: { type: string, nullable: true }
                  is_beta: { type: boolean }
        "400":
          description: Missing id_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Missing id_token }
        "401":
          description: Token failed verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Invalid id_token }

  /connect:
    get:
      tags: [auth]
      summary: OAuth launch point and redirect target
      description: |
        Serves the SPA shell. The client either redirects to the provider
        (no fragment) or posts the fragment's id_token to
        `/api/auth/session` and then honours `return_to`.
      parameters:
        - { name: return_to, in: query, schema: { type: string, default: / } }
      responses:
        "200": { description: The SPA shell }

  /logout:
    post:
      tags: [auth]
      summary: End the session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nt_session

  parameters:
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation failure or malformed body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Unauthorized }
    NotFound:
      description: Missing resource, or one the caller may not see
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Script not found }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }

    FavoriteState:
      type: object
      properties:
        script_id: { type: string, format: uuid }
        is_favorite: { type: boolean }

    Release:
      type: object
      properties:
        id: { type: integer, example: 15862 }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time, example: "2026-10-28T15:00:41.895585Z" }

    Script:
      type: object
      properties:
        script_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        user_map_id: { type: string, format: uuid, nullable: true }
        user_map_internal_id:
          type: string
          nullable: true
          pattern: "^[0-9A-Z]{9}:[0-9A-Z]{9}$"
          example: CRPJR2C0U:9YGC8UV9RCJ
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
        author_uuid: { type: string, format: uuid }
        author_name: { type: string }
        is_favorite: { type: boolean }
